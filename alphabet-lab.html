<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Wissenschaftlich orientierter Ukrainisch-Alphabettrainer für deutschsprachige Erwachsene." />
  <link rel="manifest" href="alphabet-lab.webmanifest" />
  <link rel="icon" href="ukrainisch-icon-192.png" />
  <title>Alphabet Lab · Ukrainisch</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f4f5f7;--card:#fff;--line:#d9dde5;--muted:#667085;--accent:#1f6feb;--good:#157f3b;--bad:#b42318;--warn:#9a6700;--ink:#111827}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f7f8fa,#eef1f5);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.app{max-width:930px;margin:0 auto;padding:18px 16px 96px}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}.brand{font-weight:850;letter-spacing:-.02em;font-size:20px}.spacer{flex:1}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 34px rgba(16,24,40,.05);margin:12px 0}.hero{padding:28px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}.hero h1{font-size:clamp(30px,6vw,54px);line-height:.98;letter-spacing:-.05em;margin:8px 0 13px}.hero p{max-width:720px;color:var(--muted);line-height:1.55;margin:0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:#e9edf3;color:#111827}.btn.primary{background:var(--accent);color:#fff}.btn.good{background:#e9f7ee;color:#0f6b31}.btn.danger{background:#fff0ee;color:#9c1c13}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.stat{grid-column:span 3}.stat strong{display:block;font-size:28px;letter-spacing:-.04em}.stat span{font-size:12px;color:var(--muted)}.progress{height:12px;background:#e8ebf0;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);border-radius:inherit}.section-title{display:flex;align-items:flex-end;gap:10px;margin:24px 3px 8px}.section-title h2{margin:0;font-size:19px}.section-title small{color:var(--muted)}.letters{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}.letter-chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:11px;text-align:center;min-height:74px;position:relative}.letter-chip b{display:block;font-size:25px}.letter-chip span{font-size:11px;color:var(--muted)}.letter-chip .meter{position:absolute;left:9px;right:9px;bottom:7px;height:4px;background:#edf0f4;border-radius:99px;overflow:hidden}.letter-chip .meter i{display:block;height:100%;background:var(--good)}.lesson{max-width:680px;margin:0 auto}.lesson-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}.lesson-head .progress{flex:1}.stage{min-height:520px;display:flex;flex-direction:column;justify-content:center}.big-letter{font-size:clamp(108px,28vw,190px);font-weight:850;line-height:.8;text-align:center;letter-spacing:-.08em}.small-letter{text-align:center;color:var(--muted);font-size:20px;margin:18px 0 4px}.sound{font-size:25px;text-align:center;font-weight:800;margin:12px 0}.ipa{text-align:center;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.word{font-size:32px;font-weight:850;text-align:center;margin-top:14px}.word small{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-top:4px}.note{border-left:4px solid #d0d5dd;padding:9px 12px;background:#f8fafc;border-radius:8px;color:#475467;line-height:1.45;margin:12px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.answer{min-height:58px;border:1px solid var(--line);border-radius:16px;background:#fff;font-weight:800;padding:10px}.answer:hover{border-color:#98a2b3}.answer.correct{background:#eaf8ef;border-color:#79c793;color:#105c2b}.answer.wrong{background:#fff0ee;border-color:#f1a59c;color:#8f1e15}.feedback{min-height:48px;margin-top:12px;font-weight:750;text-align:center}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.keyboard{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:14px}.key{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 4px;font-weight:800;font-size:20px}.audio-row{display:flex;justify-content:center;gap:8px;margin:14px 0}.canvas-wrap{max-width:390px;margin:14px auto}.trace-canvas{width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:20px;background:#fff;touch-action:none}.trace-actions{display:flex;justify-content:center;gap:8px;margin-top:8px}.pair{font-size:clamp(56px,15vw,110px);text-align:center;font-weight:850;letter-spacing:.05em}.prompt{font-size:22px;text-align:center;font-weight:800;line-height:1.35}.micro{background:#111827;color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:14px}.micro small{color:#c7ced8}.mastery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mastery-item{border:1px solid var(--line);border-radius:16px;padding:14px}.mastery-item strong{display:block}.mastery-item small{color:var(--muted)}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#eef2f6;color:#475467;font-size:11px;font-weight:800}.hidden{display:none!important}.confusion{display:flex;flex-wrap:wrap;gap:7px}.confusion span{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-weight:750}.science li{margin:8px 0;line-height:1.45;color:#475467}.science a{color:var(--accent)}.footer{color:var(--muted);text-align:center;font-size:12px;margin-top:28px}.modal{position:fixed;inset:0;background:rgba(17,24,39,.58);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal .card{max-width:620px;width:100%;max-height:90vh;overflow:auto}.badge{font-size:46px}.test-score{font-size:54px;font-weight:900;letter-spacing:-.05em;text-align:center}.diagnostic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.diagnostic-grid .answer{font-size:24px}.muted{color:var(--muted)}
    @media(max-width:700px){.app{padding:12px 10px 88px}.hero{padding:20px}.card{border-radius:18px;padding:16px}.stat{grid-column:span 6}.answers{grid-template-columns:1fr}.keyboard{grid-template-columns:repeat(5,1fr)}.stage{min-height:calc(100vh - 150px)}.mastery-grid{grid-template-columns:1fr}.diagnostic-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <main class="app" id="app" aria-live="polite"></main>
  <script src="ukrainischkurs-native-audio.js"></script>
  <script src="alphabet-lab.js"></script>
  <script>
    if('serviceWorker' in navigator){navigator.serviceWorker.register('./alphabet-lab-sw.js').catch(()=>{});}
  </script>
</body>
</html>
