name: Alphabet Lab Live Pages Smoke

on:
  workflow_run:
    workflows: ['Build Alphabet Lab artifacts']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed GitHub Pages build
        run: node tests/live-pages-smoke.mjs
