name: Build static app shell

on:
  push:
    branches: [main]
    paths:
      - 'ukrainisch-lernen.html'
      - 'scripts/build-app-shell.mjs'
      - '.github/workflows/build-app-shell.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ukrainischkurs-app-shell-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Statische App-Hülle generieren
        run: node scripts/build-app-shell.mjs
      - name: Generierte Hülle committen
        shell: bash
        run: |
          if git diff --quiet -- ukrainischkurs-app.html; then
            echo 'App-Hülle bereits aktuell.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ukrainischkurs-app.html
          git commit -m 'Generiere statische App-Hülle'
          git pull --rebase origin main
          git push
