name: Validate Ukrainischkurs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: App-Hülle deterministisch lokal generieren
        run: node scripts/build-app-shell.mjs
      - name: Kurs, Lektionen, Sprachpolitur und alle bisherigen Regressionen vollständig validieren
        run: node tests/validate-v73-linguistic-polish.mjs
      - name: A1-Auswahloptionen validieren
        run: node tests/validate-a1-options.mjs
      - name: A1-Gate Stage-Logik validieren
        run: node tests/validate-a1-gate-stage-logic.mjs
      - name: Alphabet Lab Legacy-Regeln validieren
        run: node tests/validate-alphabet-lab.mjs
      - name: Alphabet Lab v2 Kompatibilität validieren
        run: node tests/validate-alphabet-lab-v2.mjs
      - name: Alphabet Lab v3 Behavioral Tests
        run: node tests/validate-alphabet-lab-v3.mjs
      - name: Alphabet Lab Service Worker Regression
        run: node tests/validate-alphabet-lab-sw-v3.mjs
      - name: Alphabet Lab v3 leichte DOM-Smoke-Tests
        run: node tests/validate-alphabet-lab-dom-smoke.mjs
      - name: Alphabet Lab v3 Persona-Simulationen
        run: node tests/validate-alphabet-lab-personas-v3.mjs
      - name: Alphabet Lab V4 adaptive Engine und Diversity
        run: node tests/validate-alphabet-lab-v4.mjs
      - name: Alphabet Lab V4 Joel Persona-Simulationen
        run: node tests/validate-alphabet-lab-v4-personas.mjs
      - name: Alphabet Lab V4 Abschlussfunktionen
        run: node tests/validate-alphabet-lab-v4-completion.mjs
      - name: Alphabet Lab V5 Production Core
        run: node tests/validate-alphabet-lab-v5-production.mjs
      - name: Alphabet Lab V5 Mastery und Migration
        run: node tests/validate-alphabet-lab-v5-mastery.mjs
      - name: Alphabet Lab V5 Persona-Simulationen A-F
        run: node tests/validate-alphabet-lab-v5-personas.mjs

  browser:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Playwright installieren
        run: npm install --no-save @playwright/test@latest
      - name: Chromium und WebKit installieren
        run: npx playwright install --with-deps chromium webkit
      - name: Alphabet Lab V5 echte Browser-E2E
        run: npx playwright test --config=playwright.config.mjs
