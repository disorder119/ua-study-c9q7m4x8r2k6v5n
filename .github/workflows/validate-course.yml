name: Validate Ukrainischkurs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: App-Hülle deterministisch lokal generieren
        run: node scripts/build-app-shell.mjs
      - name: Kurs vollständig validieren
        run: node tests/validate-v42.mjs
