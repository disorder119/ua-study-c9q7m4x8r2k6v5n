name: Apply A1 options hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-a1-options-hotfix.yml'
      - 'scripts/fix-a1-options.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Richtige Antwort in Auswahl garantieren
        run: node scripts/fix-a1-options.mjs
      - name: Hotfix committen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ukrainischkurs-a1-exam.js
          git commit -m 'Garantiert richtige Antwort in A1-Auswahl' 
          git pull --rebase origin main
          git push
